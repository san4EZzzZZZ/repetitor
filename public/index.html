<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кабинет репетитора</title><link rel="stylesheet" href="/style.css"></head><body><main id="app"><section class="card auth"><h1>Кабинет репетитора</h1><p class="muted">Запись на занятия в удобное время</p><div class="tabs"><button onclick="showAuth('login')">Войти</button><button onclick="showAuth('register')">Регистрация</button></div><form id="authForm"><input name="name" placeholder="Имя" class="registerOnly"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Пароль (минимум 6 символов)" required><input name="tutorCode" placeholder="Код репетитора (если нужен)" class="registerOnly"><button class="primary">Продолжить</button><p id="authError" class="error"></p></form></section></main><script src="/app.js"></script></body></html>
